name: Build SnapBurst Global Technical Response PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ReportLab
        run: pip install reportlab
      - name: Build PDF
        run: python .github/tmp/build_global_technical_response.py
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/SnapBurst-Global-Technical-Need-and-Product-Response.pdf
          git commit -m "Add SnapBurst global technical need and product response" || exit 0
          git push
