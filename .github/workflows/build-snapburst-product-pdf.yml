name: Build SnapBurst Product PDF
on:
  push:
    branches: [main]
    paths:
      - 'product/.pdf-build/**'
      - '.github/workflows/build-snapburst-product-pdf.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check reportlab
      - run: python product/.pdf-build/build_pdf.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/SnapBurst-Product-Overview.pdf
          git rm -r product/.pdf-build .github/workflows/build-snapburst-product-pdf.yml
          git commit -m "Add SnapBurst product overview PDF"
          git push
